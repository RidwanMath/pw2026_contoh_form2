<body>
  <h2>Form Pendaftaran</h2>

  <form action="">
    <label for="nama">Nama :</label>
    <input id="nama" type="text" placeholder="Masukkan nama kamu">

    <label for="umur">Umur :</label>
    <input id="umur" type="text" placeholder="Masukkan umur kamu">

    <label for="prodi">Prodi :</label>
    <select name="" id="prodi">
      <option value="Matematika">Matematika</option>
      <option value="Biologi">Biologi</option>
    </select>

    <label for="angkatan">Angkatan :</label>
    <input id="angkatan" type="text" placeholder="Masukkan tahun angkatan">

    <label for="password">Password :</label>
    <input id="password" type="password" placeholder="Masukkan password">

    <label for="keterangan">Keterangan :</label>
    <textarea name="" id="keterangan" placeholder="Tulis keterangan di sini"></textarea>

    <button type="submit">Kirim</button>
  </form>
</body>
